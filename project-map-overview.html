<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Map Overview</title>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root{--bg:#f3f6f8;--panel:#fff;--text:#152129;--muted:#657580;--line:#e1e8ed;--blue:#286de0;--tint:#edf4ff}html[data-theme=dark]{--bg:#101b27;--panel:#182737;--text:#edf3f8;--muted:#a0b1bf;--line:#334859;--tint:#203b58}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:600 14px 'Bai Jamjuree',sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}button,input,select{font:inherit;color:inherit}button,select,input{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 11px}button{cursor:pointer}button:hover{border-color:var(--blue)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line)}h1{margin:0;font-size:clamp(17px,1.6vw,23px);flex:1}.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(250px,300px) minmax(0,1fr) minmax(280px,340px)}aside{padding:16px;background:var(--panel);overflow:auto;min-width:0;scrollbar-width:thin}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}#map{min-width:0;height:100%;background:var(--bg)}.filters{display:grid;gap:10px}.filters input,.filters select{width:100%;min-width:0}.muted{color:var(--muted);font-size:12px;line-height:1.7}#count{padding:12px 0}#projects{display:grid;gap:6px}.project{width:100%;text-align:left;display:grid;gap:3px;padding:10px;line-height:1.5}.project.active{border-color:var(--blue);background:var(--tint)}.project small{font-size:12px;color:var(--muted)}h2{font-size:19px;line-height:1.5;margin:0 0 8px;overflow-wrap:anywhere}h3{font-size:14px;margin:18px 0 8px}dl{margin:0}dl>div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}dt{color:var(--muted);font-size:12px}dd{margin:0;text-align:right;overflow-wrap:anywhere;font-weight:700}.capacity{padding:14px;background:var(--tint);border:1px solid var(--line);border-radius:12px;margin:14px 0}.capacity b{font-size:26px}.equipment{border:1px solid var(--line);border-radius:10px;padding:10px;margin:7px 0;line-height:1.8}.empty{padding:16px 0;color:var(--muted)}.pm-pin{background:#2873e6;border:3px solid #fff;border-radius:50%;box-shadow:0 2px 7px #1236}.pm-pin.selected{background:#e89224}.leaflet-tooltip{font:600 12px 'Bai Jamjuree',sans-serif}.badge{display:inline-block;padding:3px 7px;border-radius:6px;background:var(--tint);color:var(--muted);font-size:11px}#status{padding:5px 18px;font-size:12px;background:var(--panel)}#status:empty{display:none}@media(max-width:1050px){.layout{grid-template-columns:240px minmax(0,1fr) 280px}aside{padding:12px}}@media(max-width:760px){body{height:auto;min-height:100dvh;overflow:auto}.layout{display:grid;grid-template-columns:1fr}#map{height:55dvh;grid-row:1}aside{max-height:55dvh}.right{max-height:none}.left{border-right:0}header{padding:10px}h1{flex-basis:100%}}
.leaflet-tooltip.project-map-name{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--text);box-shadow:0 2px 6px #1232;font-size:12px;font-weight:700}.leaflet-tooltip.project-map-name:before{border-right-color:var(--panel)}
</style></head><body>
<header><button id="back">← Main</button><h1>Project Map Overview</h1><button id="fit">พอดีแผนที่</button><button id="language">TH / EN</button><button id="theme">Light / Dark</button></header>
<div id="status" role="status">กำลังโหลดข้อมูลโครงการ…</div>
<main class="layout"><aside class="left"><div class="filters"><input id="search" type="search" placeholder="ค้นหาโครงการ / รุ่นอุปกรณ์" aria-label="Search projects"><select id="province" aria-label="Province"></select><label><input id="missing" type="checkbox" style="width:auto"> <span id="missingLabel">เฉพาะโครงการไม่มีพิกัด</span></label></div><div id="count" class="muted"></div><div id="projects"></div></aside><div id="map" aria-label="Project map"></div><aside class="right"><div id="detail" class="empty">เลือกโครงการบนแผนที่หรือจากรายการ</div></aside></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cloud-core.js?v=20261006-ui-polish1"></script><script src="project-map-overview.js?v=20261007-project-names1"></script></body></html>
