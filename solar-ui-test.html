<script id="model">
const names=['Yong Thai Rubber','Capsule','Sanyoy','Wing Fung Packaging','Huamei','Siam Food','Thai Beverage','Bangkok Cold Storage'];
const copy=x=>JSON.parse(JSON.stringify(x));
const defaultFilter=()=>({projects:names.slice(0,2),periods:['2026-09'],status:'all',review:'all'});
function normalizeFilter(value){if(!value||!Array.isArray(value.projects)||!Array.isArray(value.periods))return defaultFilter();return{projects:[...new Set(value.projects.filter(p=>names.includes(p)))],periods:[...new Set(value.periods.filter(p=>/^202[56]-(0[1-9]|1[0-2])$/.test(p)))],status:['all','normal','abnormal'].includes(value.status)?value.status:'all',review:['all','reviewed','recheck','unreviewed'].includes(value.review)?value.review:'all'};}
function toggleDraft(draft,project,checked){draft.projects=checked?[...new Set([...draft.projects,project])]:draft.projects.filter(p=>p!==project);return draft;}
function demoRows(page,filter){return filter.projects.flatMap(project=>filter.periods.map(period=>{const i=names.indexOf(project),m=Number(period.slice(5)),normal=(i+m)%3!==0,review=['reviewed','recheck','unreviewed'][i%3];return{project,period,status:normal?'normal':'abnormal',review,value:page==='PR'?Number((75+i*.7+m*.1).toFixed(3)):page==='GI'?Number((3.2+i*.08+m*.03).toFixed(3)):page==='WD'?20+(i+m)%9:Number((98.1+i*.3).toFixed(3))};})).filter(r=>(filter.status==='all'||r.status===filter.status)&&(filter.review==='all'||r.review===filter.review));}
const testKey='solar.shared-ui-lab.v1';
</script><script>
const $=id=>document.getElementById(id),tr=(th,en)=>lang==='th'?th:en;
let lang='th',theme='light',page='PR',filters={PR:defaultFilter(),WD:defaultFilter(),GI:defaultFilter(),INV:defaultFilter()},draft=null,kind='',opener=null,request=0;
try{const saved=JSON.parse(localStorage.getItem(testKey)||'null');if(saved){lang=saved.lang==='en'?'en':'th';theme=saved.theme==='dark'?'dark':'light';page=['PR','WD','GI','INV'].includes(saved.page)?saved.page:'PR';for(const p of Object.keys(filters))filters[p]=normalizeFilter(saved.filters?.[p]);}}catch{}
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
const icon=(type)=>'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+({projects:'<path d="M4 6h16M4 12h16M4 18h16"/>',period:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>',status:'<path d="M4 4h16l-6 8v7l-4 2v-9z"/>'}[type]||'')+'</svg>';
const labels={normal:['ปกติ','Normal'],abnormal:['ผิดปกติ','Abnormal'],reviewed:['ตรวจแล้ว','Reviewed'],recheck:['ตรวจซ้ำ','Recheck'],unreviewed:['ยังไม่ตรวจ','Not reviewed'],all:['ทั้งหมด','All']};
const label=k=>tr(...labels[k]);
function remember(){try{localStorage.setItem(testKey,JSON.stringify({lang,theme,page,filters}));$('message').textContent=tr('จำตัวกรองของเวอร์ชันทดสอบแล้ว · ไม่ได้บันทึกข้อมูลจริง','Test preferences remembered · No production data saved');}catch{$('message').textContent=tr('เบราว์เซอร์ไม่อนุญาตให้จำตัวกรอง','Browser storage is unavailable');}}
function applyText(){document.documentElement.lang=lang;document.documentElement.dataset.theme=theme;document.querySelectorAll('[data-th]').forEach(el=>el.textContent=el.dataset[lang]);for(const l of ['th','en'])$(l).classList.toggle('active',l===lang);for(const t of ['light','dark'])$(t).classList.toggle('active',t===theme);document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));const guides=lang==='th'?['เปิดเลือกโครงการ ค้นหา Yong แล้วติ๊ก จากนั้นค้นหา Capsule แล้วติ๊ก — รายการเดิมยังอยู่','กดยกเลิก — ตารางและตัวกรองต้องยังเป็นค่าก่อนเปิด','เปิดอีกครั้งแล้วกดนำไปใช้ — แสดงเฉพาะรายการที่ติ๊ก แม้มีคำค้นหาค้าง','เลือกหลายเดือนหรือทั้งปี สถานะและโครงการต้องไม่ถูกล้าง','สลับแท็บแล้วกลับมา หรือรีเฟรช — แต่ละหน้าจำตัวกรองของตัวเอง','สลับ TH/EN และสว่าง/มืด แล้วส่งออก Excel XML จากข้อมูลที่แสดง']:['Search and select Yong, then Capsule — earlier choices remain selected','Cancel — applied filters and table remain unchanged','Apply — use checked projects, even while a search term remains','Select multiple months or a whole year without clearing other filters','Switch tabs and refresh — each module retains its own filters','Try TH/EN, light/dark and export displayed sample rows as Excel XML'];$('guide').innerHTML=guides.map(x=>'<li>'+x+'</li>').join('');}
function updateHeader(){applyText();const f=filters[page];$('title').textContent={PR:'PR Report',WD:'Working Days Workspace',GI:'Global Irradiance Analysis',INV:'Inverter Report'}[page];$('caption').textContent=tr('ตัวอย่างหน้าตาและการเลือกข้อมูล · ตัวเลขไม่ใช่ผลคำนวณจริง','Interaction prototype · Values are synthetic, not engineering calculations');$('projects').innerHTML=icon('projects')+tr('โครงการ','Projects')+' · '+f.projects.length;$('period').innerHTML=icon('period')+tr('ช่วงเวลา','Period')+' · '+f.periods.length;$('status').innerHTML=icon('status')+tr('สถานะและการตรวจ','Status & review');$('summary').textContent=tr(`${f.projects.length} โครงการ · ${f.periods.length} เดือน · ${f.periods.join(', ')||'ไม่เลือกช่วงเวลา'} · ${label(f.status)} · ${label(f.review)}`,`${f.projects.length} projects · ${f.periods.length} months · ${f.periods.join(', ')||'No periods'} · ${label(f.status)} · ${label(f.review)}`);$('summary').title=f.projects.join(', ');}
function renderRows(){const f=filters[page],rows=demoRows(page,f),metric={PR:'PR with loss (%)',WD:tr('วันทำงาน','Working days'),GI:'GI (kWh/m²)',INV:'Availability (%)'}[page];$('thead').innerHTML='<tr>'+[tr('โครงการ','Project'),tr('เดือน','Month'),metric,tr('สถานะ','Status'),tr('การตรวจ','Review')].map((x,i)=>'<th'+(i===2?' class="num"':'')+'>'+x+'</th>').join('')+'</tr>';$('tbody').innerHTML=rows.map(r=>`<tr><td>${esc(r.project)}</td><td>${r.period}</td><td class="num">${page==='WD'?r.value:r.value.toFixed(3)}</td><td><span class="pill ${r.status}">${label(r.status)}</span></td><td><span class="pill ${r.review}">${label(r.review)}</span></td></tr>`).join('')||`<tr><td colspan="5" class="empty">${tr('ไม่มีข้อมูลตามตัวกรอง — ลองเพิ่มโครงการหรือเดือน','No data for these filters — add projects or periods')}</td></tr>`;}
async function refresh(simulate=false){const seq=++request;updateHeader();$('loadingText').textContent=tr('กำลังแสดงข้อมูลจำลองตามตัวกรอง…','Preparing sample data for applied filters…');$('loading').hidden=!simulate;document.querySelector('.data-area').setAttribute('aria-busy',String(simulate));if(simulate)await new Promise(r=>setTimeout(r,240));if(seq!==request)return;renderRows();$('loading').hidden=true;document.querySelector('.data-area').setAttribute('aria-busy','false');}
function closePicker(){draft=null;$('picker').close();opener?.focus();}
function draftCount(){if(!draft)return;$('draftSummary').textContent=tr(`${draft.projects.length} โครงการ · ${draft.periods.length} เดือน`,`${draft.projects.length} projects · ${draft.periods.length} months`);}
function projectList(){const q=$('search').value.trim().toLowerCase();$('choices').innerHTML=names.filter(p=>p.toLowerCase().includes(q)).map(p=>`<label class="choice"><input type="checkbox" value="${esc(p)}" ${draft.projects.includes(p)?'checked':''}><span>${esc(p)}</span></label>`).join('')||'<p class="muted">'+tr('ไม่พบโครงการ','No matching projects')+'</p>';$('chips').innerHTML=draft.projects.map(p=>`<button class="btn" data-remove="${esc(p)}" aria-label="${esc(tr('ยกเลิกเลือก ','Remove ')+p)}">${esc(p)} ×</button>`).join('');draftCount();}
function months(){const y=$('year').value;const monthNames=lang==='th'?['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.']:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];$('months').innerHTML=monthNames.map((n,i)=>{const v=y+'-'+String(i+1).padStart(2,'0');return `<button class="btn ${draft.periods.includes(v)?'active':''}" aria-pressed="${draft.periods.includes(v)}" data-month="${v}">${n}</button>`}).join('');$('selectedPeriods').textContent=tr('เลือกแล้ว: ','Selected: ')+(draft.periods.slice().sort().join(', ')||'—');draftCount();}
function openPicker(type,button){kind=type;opener=button;draft=copy(filters[page]);$('pickerTitle').textContent=type==='projects'?tr('เลือกโครงการ','Select projects'):type==='period'?tr('เลือกเดือนและปี','Select months & years'):tr('สถานะและการตรวจ','Status & review');if(type==='projects'){$('pickerBody').innerHTML=`<input class="control" type="search" id="search" placeholder="${tr('ค้นหาชื่อโครงการ','Search projects')}" aria-label="${tr('ค้นหาชื่อโครงการ','Search projects')}"><div class="chips" id="chips"></div><div class="row"><button class="btn" id="allFound">${tr('เลือกผลค้นหาทั้งหมด','Add all matches')}</button><button class="btn" id="clearDraft">${tr('ล้างที่เลือก','Clear selection')}</button></div><div class="list" id="choices"></div>`;$('search').oninput=projectList;$('choices').onchange=e=>{toggleDraft(draft,e.target.value,e.target.checked);projectList();};$('chips').onclick=e=>{const b=e.target.closest('[data-remove]');if(b){toggleDraft(draft,b.dataset.remove,false);projectList();}};$('allFound').onclick=()=>{const q=$('search').value.trim().toLowerCase();names.filter(p=>p.toLowerCase().includes(q)).forEach(p=>toggleDraft(draft,p,true));projectList();};$('clearDraft').onclick=()=>{draft.projects=[];projectList();};projectList();}else if(type==='period'){$('pickerBody').innerHTML=`<label class="field">${tr('ปี','Year')}<select class="control" id="year"><option>2026</option><option>2025</option></select></label><div class="row"><button class="btn" id="wholeYear">${tr('เพิ่มทั้งปีที่เลือก','Add selected year')}</button><button class="btn" id="lifetime">${tr('ทั้งหมด (ข้อมูลจำลอง 2025–2026)','All sample periods (2025–2026)')}</button><button class="btn" id="clearPeriods">${tr('ล้างเดือน','Clear months')}</button></div><div class="month-grid" id="months" style="margin-top:14px"></div><p class="muted small" id="selectedPeriods"></p>`;$('year').value=draft.periods.at(-1)?.slice(0,4)||'2026';$('year').onchange=months;$('months').onclick=e=>{const b=e.target.closest('[data-month]');if(b){const v=b.dataset.month;draft.periods=draft.periods.includes(v)?draft.periods.filter(p=>p!==v):[...draft.periods,v];months();}};$('wholeYear').onclick=()=>{for(let i=1;i<=12;i++)draft.periods.push($('year').value+'-'+String(i).padStart(2,'0'));draft.periods=[...new Set(draft.periods)];months();};$('lifetime').onclick=()=>{draft.periods=[];for(const y of ['2025','2026'])for(let i=1;i<=12;i++)draft.periods.push(y+'-'+String(i).padStart(2,'0'));months();};$('clearPeriods').onclick=()=>{draft.periods=[];months();};months();}else{$('pickerBody').innerHTML=['status','review'].map(k=>`<label class="field">${k==='status'?tr('สถานะข้อมูล','Data status'):tr('สถานะตรวจ','Review status')}<select class="control" id="draft-${k}">${(k==='status'?['all','normal','abnormal']:['all','reviewed','recheck','unreviewed']).map(v=>`<option value="${v}" ${draft[k]===v?'selected':''}>${label(v)}</option>`).join('')}</select></label>`).join('');for(const k of ['status','review'])$('draft-'+k).onchange=e=>draft[k]=e.target.value;draftCount();}applyText();$('picker').showModal();if(type==='projects')$('search').focus();}
for(const type of ['projects','period','status'])$(type).onclick=()=>openPicker(type,$(type));$('close').onclick=$('cancel').onclick=closePicker;$('picker').addEventListener('cancel',e=>{e.preventDefault();closePicker();});$('apply').onclick=()=>{filters[page]=normalizeFilter(draft);closePicker();remember();refresh(true);};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;remember();refresh(true);});for(const l of ['th','en'])$(l).onclick=()=>{lang=l;remember();refresh();};for(const t of ['light','dark'])$(t).onclick=()=>{theme=t;remember();refresh();};$('reset').onclick=()=>{filters[page]=defaultFilter();remember();refresh(true);};$('forget').onclick=()=>{try{localStorage.removeItem(testKey);}catch{}filters={PR:defaultFilter(),WD:defaultFilter(),GI:defaultFilter(),INV:defaultFilter()};$('message').textContent=tr('ล้างความจำทดสอบแล้ว','Test preferences cleared');refresh();};
